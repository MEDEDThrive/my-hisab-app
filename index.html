<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>लक्ष्मी हिसाब-किताब (Laxmi Hisab-Kitab - Ultimate Animation Edition)</title>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #080a0f 0%, #121824 50%, #080a0f 100%);
      --card-bg: rgba(22, 28, 42, 0.65);
      --card-border: rgba(255, 215, 0, 0.25);
      --accent-gold: #ffd700;
      --accent-gold-glow: rgba(255, 215, 0, 0.5);
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --green-glow: #10b981;
      --red-glow: #ef4444;
      --blue-glow: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 70px;
      overflow-x: hidden;
    }

    /* Dynamic Background Water Animation */
    .bg-animation {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: -1; overflow: hidden;
    }

    .bubble {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,215,0,0.15), rgba(255,215,0,0.01));
      border: 1px solid rgba(255,215,0,0.15);
      animation: floatUp 12s infinite linear;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* Water-Drop Lock Screen */
    #pinOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, rgba(18, 24, 38, 0.98) 0%, rgba(8, 10, 15, 0.99) 100%);
      z-index: 10000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      backdrop-filter: blur(25px);
      animation: fadeIn 0.5s ease-out;
    }

    .drop-lock-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 35px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 30px rgba(255, 215, 0, 0.15);
      width: 90%; max-width: 360px;
      position: relative; animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .water-drop-icon {
      width: 80px; height: 80px;
      margin: 0 auto 20px;
      background: radial-gradient(circle at 35% 35%, #ffe600, #b8860b);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 12px 30px rgba(255, 215, 0, 0.4), inset -4px -4px 10px rgba(0,0,0,0.5);
      display: flex; justify-content: center; align-items: center;
      animation: dropLiquid 3s ease-in-out infinite alternate;
    }

    .water-drop-icon i { transform: rotate(45deg); font-size: 30px; color: #000; }

    @keyframes dropLiquid {
      0% { transform: rotate(-45deg) translateY(0px) scale(1); border-radius: 50% 50% 50% 0; }
      50% { transform: rotate(-45deg) translateY(-10px) scale(1.05); border-radius: 45% 55% 45% 10%; }
      100% { transform: rotate(-45deg) translateY(0px) scale(1); border-radius: 50% 50% 50% 0; }
    }

    .pin-title { font-size: 22px; font-weight: 700; color: var(--accent-gold); letter-spacing: 0.5px; }
    .pin-subtitle { font-size: 13px; color: var(--text-sub); margin-top: 4px; margin-bottom: 22px; }

    .pin-dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 28px; }
    .pin-dot {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
      background: rgba(255,215,0,0.05);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .pin-dot.filled {
      background: radial-gradient(circle at 30% 30%, #ffffff, var(--accent-gold));
      box-shadow: 0 0 15px var(--accent-gold);
      transform: scale(1.2);
    }   
    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; justify-items: center; }
    .key-btn {
      width: 68px; height: 68px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,215,0,0.25);
      color: #fff; font-size: 24px; font-weight: 600;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; position: relative; overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 2px 6px rgba(255,255,255,0.3);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .key-btn:active {
      transform: scale(0.88);
      box-shadow: 0 2px 8px rgba(0,0,0,0.7), inset 0 0 15px var(--accent-gold);
    }

    /* Water Ripple Effect */
    .water-ripple {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,215,0,0.8) 0%, rgba(255,215,0,0) 70%);
      transform: scale(0); animation: rippleAnim 0.5s ease-out;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(3.5); opacity: 0; }
    }

    /* Layout & Header */
    header {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(20px);
      padding: 18px 20px;
      text-align: center;
      border-bottom: 1px solid var(--card-border);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .app-title {
      font-size: 22px; font-weight: 800;
      background: linear-gradient(135deg, #ffe600, #ffaa00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }

    .container { max-width: 550px; margin: auto; padding: 18px; }

    /* Animated Cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px; margin-bottom: 18px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover { border-color: rgba(255,215,0,0.45); }

    .balance-card {
      text-align: center;
      background: linear-gradient(145deg, rgba(255,215,0,0.12), rgba(18,24,38,0.8));
      border: 1px solid var(--accent-gold);
      position: relative; overflow: hidden;
    }

    .balance-card::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 60%);
      animation: rotateGlow 10s linear infinite; pointer-events: none;
    }

    @keyframes rotateGlow { 100% { transform: rotate(360deg); } }

    .eye-btn {
      position: absolute; top: 18px; right: 18px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: var(--accent-gold); border-radius: 50%; width: 40px; height: 40px;
      cursor: pointer; transition: all 0.2s; z-index: 2;
      display: flex; justify-content: center; align-items: center;
    }
    .eye-btn:hover { transform: scale(1.1); background: rgba(255,215,0,0.2); }

    .balance-title { font-size: 12px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; z-index: 2; position: relative; }
    .balance-amount {
      font-size: 38px; font-weight: 800; color: var(--accent-gold);
      margin: 8px 0; text-shadow: 0 0 25px var(--accent-gold-glow);
      z-index: 2; position: relative; transition: all 0.3s;
    }

    .smart-barometer {
      display: flex; justify-content: space-between; background: rgba(0,0,0,0.45);
      padding: 12px 16px; border-radius: 14px; margin-top: 14px; font-size: 13px;
      border: 1px solid rgba(255,255,255,0.08); z-index: 2; position: relative;
    }

    .alert-banner {
      background: rgba(239, 68, 68, 0.2); border: 1px solid var(--red-glow);
      color: #fca5a5; padding: 12px; border-radius: 14px; margin-bottom: 18px;
      font-size: 13px; display: none; text-align: center; animation: pulseAlert 2s infinite;
    }
    @keyframes pulseAlert { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    /* Quick Chips */
    .chips-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
    .chip {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      padding: 9px 16px; border-radius: 25px; font-size: 12px; white-space: nowrap;
      cursor: pointer; transition: all 0.25s; color: var(--text-main);
    }
    .chip:hover { border-color: var(--accent-gold); background: rgba(255,215,0,0.15); transform: translateY(-2px); }

    /* Form Controls */
    .form-group { margin-bottom: 14px; }
    label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; margin-bottom: 6px; display: block; letter-spacing: 0.5px; }
    input, select {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(10, 14, 22, 0.6);
      color: #fff; font-size: 14px; outline: none; transition: 0.25s;
    }
    input:focus, select:focus { border-color: var(--accent-gold); box-shadow: 0 0 15px var(--accent-gold-glow); }

    .input-row { display: flex; gap: 10px; }

    .mic-btn {
      background: rgba(255, 215, 0, 0.12); color: var(--accent-gold);
      border: 1px solid var(--accent-gold); width: 50px; border-radius: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px;
      transition: all 0.2s;
    }
    .mic-btn.recording { background: var(--red-glow); color: #fff; border-color: var(--red-glow); animation: pulseMic 1s infinite; }
    @keyframes pulseMic { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    .btn {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.25s;
      display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .btn-gold {
      background: linear-gradient(135deg, #ffe600, #ffaa00);
      color: #000; box-shadow: 0 6px 20px rgba(255,215,0,0.35);
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,215,0,0.5); }
    .btn-gold:active { transform: translateY(0); }

    .btn-outline { background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); }
    .btn-outline:hover { background: rgba(255,215,0,0.1); }

    /* Type Switcher */
    .type-selector { display: flex; gap: 8px; margin-bottom: 14px; }
    .type-btn {
      flex: 1; padding: 12px 6px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; font-size: 12px; cursor: pointer; background: rgba(0,0,0,0.4); color: var(--text-sub);
      transition: all 0.25s;
    }
    .type-btn.active { border-color: var(--accent-gold); background: rgba(255,215,0,0.18); color: var(--accent-gold); font-weight: bold; }

    /* Heatmap Grid */
    .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
    .heatmap-day { padding: 10px 2px; border-radius: 8px; font-size: 11px; text-align: center; background: rgba(255,255,255,0.03); transition: transform 0.2s; }
    .heatmap-day:hover { transform: scale(1.1); }
    .heat-low { background: rgba(16, 185, 129, 0.25); border: 1px solid #10b981; }
    .heat-mid { background: rgba(245, 158, 11, 0.25); border: 1px solid #f59e0b; }
    .heat-high { background: rgba(239, 68, 68, 0.25); border: 1px solid #ef4444; }

    /* Transaction List Items */
    .tx-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(10, 14, 22, 0.5); padding: 14px 16px; border-radius: 14px;
      margin-bottom: 10px; border-left: 4px solid var(--accent-gold);
      animation: fadeIn 0.4s ease-out; transition: all 0.2s;
    }
    .tx-item:hover { transform: translateX(3px); background: rgba(10, 14, 22, 0.8); }
    .tx-item.income { border-left-color: var(--green-glow); }
    .tx-item.expense { border-left-color: var(--red-glow); }
    .tx-item.lend { border-left-color: var(--blue-glow); }
    .tx-settled { opacity: 0.45; text-decoration: line-through; }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>

  <!-- Floating Water Bubbles Background -->
  <div class="bg-animation">
    <div class="bubble" style="width:80px; height:80px; left:10%; animation-duration:10s;"></div>
    <div class="bubble" style="width:40px; height:40px; left:30%; animation-duration:14s; animation-delay:2s;"></div>
    <div class="bubble" style="width:60px; height:60px; left:65%; animation-duration:11s; animation-delay:1s;"></div>
    <div class="bubble" style="width:100px; height:100px; left:85%; animation-duration:16s; animation-delay:3s;"></div>
  </div>

  <!-- Water-Drop Aesthetic PIN Lock Screen -->
  <div id="pinOverlay">
    <div class="drop-lock-card">
      <div class="water-drop-icon">

            <!-- Animated Expense Pie Chart -->
    <div class="card">
      <div style="font-weight:700; margin-bottom:12px; font-size:15px;"><i class="fa-solid fa-chart-pie"></i> खर्च का विश्लेषक (Pie Chart)</div>
      <canvas id="categoryChart" style="max-height: 220px;"></canvas>
    </div>

    <!-- Heatmap Calendar -->
    <div class="card">
      <div style="font-weight:700; margin-bottom:8px; font-size:15px;"><i class="fa-solid fa-calendar-days"></i> माह का हीटमैप कैलेंडर</div>
      <div class="heatmap-grid" id="heatmapGrid"></div>
    </div>

    <!-- Impulse Calculator -->
    <div class="card">
      <div style="font-weight:700; margin-bottom:8px; color:var(--accent-gold); font-size:15px;"><i class="fa-solid fa-lightbulb"></i> सोच-समझकर खरीदें (Impulse Tool)</div>
      <div class="input-row">
        <input type="number" id="impulsePrice" placeholder="कीमत दर्ज करें ₹">
        <button class="btn btn-outline" style="width: auto; padding:0 22px;" onclick="calcImpulse()">जाँचें</button>
      </div>
      <div id="impulseResult" style="font-size:12px; margin-top:10px; color:var(--text-sub);"></div>
    </div>

    <!-- History List -->
    <div class="card">
      <div style="font-weight:700; margin-bottom:12px; font-size:15px;"><i class="fa-solid fa-list-check"></i> लेन-देन का इतिहास</div>
      <div class="input-row" style="margin-bottom:14px;">
        <input type="text" id="searchInput" placeholder="खोजें (नाम, आइटम...)" onkeyup="renderTransactions()" style="flex:2;">
        <select id="filterMonth" onchange="renderTransactions()" style="flex:1;">
          <option value="ALL">सभी महीने</option>
        </select>
      </div>

      <div id="txList"></div>
    </div>

    <!-- Export & Share Tools (Excel, PDF, WhatsApp) -->
    <div class="card">
      <div style="font-weight:700; margin-bottom:12px; font-size:15px;"><i class="fa-solid fa-file-export"></i> एक्सपोर्ट व रिपोर्ट टूल्स</div>
      <div class="action-grid">
        <button class="btn btn-outline" onclick="exportPDF()"><i class="fa-solid fa-file-pdf"></i> PDF रिपोर्ट</button>
        <button class="btn btn-outline" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> Excel शीट</button>
        <button class="btn btn-outline" onclick="shareWhatsApp()"><i class="fa-brands fa-whatsapp"></i> WhatsApp शेयर</button>
        <button class="btn btn-outline" onclick="exportJSON()"><i class="fa-solid fa-download"></i> बैकअप (JSON)</button>
        <button class="btn btn-outline" style="grid-column: span 2;" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-upload"></i> पुराना बैकअप रीस्टोर करें</button>
        <input type="file" id="importFile" style="display:none" onchange="importJSON(event)">
      </div>
    </div>

  </div>

  <script>
    // State Management
    let transactions = JSON.parse(localStorage.getItem('laxmi_txs')) || [];
    let currentType = 'expense';
    let isHidden = false;
    let myChart = null;
    let enteredPin = "";
    let userPIN = localStorage.getItem('laxmi_pin') || '1234';
    let monthlyBudget = 10000;

    // Web Audio Synthesizers (Water Drop Sound)
    function playWaterDropSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1250, audioCtx.currentTime + 0.04);
        osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.16);

        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
      } catch(e) {}
    }

    function playCoinSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch(e) {}
    }

    // Ripple Effect Logic
    function createRipple(e) {
      const btn = e.currentTarget;
      const circle = document.createElement("span");
      const diameter = Math.max(btn.clientWidth, btn.clientHeight);
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${e.clientX - btn.getBoundingClientRect().left - diameter / 2}px`;
      circle.style.top = `${e.clientY - btn.getBoundingClientRect().top - diameter / 2}px`;
      circle.classList.add("water-ripple");
      
      const existingRipple = btn.getElementsByClassName("water-ripple")[0];
      if (existingRipple) existingRipple.remove();
      btn.appendChild(circle);
    }

    // Keypad Logic
    function pressKey(num, e) {
      if(e) createRipple(e);
      playWaterDropSound();
      if(enteredPin.length < 4) {
        enteredPin += num;
        updatePinDots();
      }
      if(enteredPin.length === 4) {
        setTimeout(verifyPin, 150);
      }
    }

    function deleteDigit(e) {
      if(e) createRipple(e);
      playWaterDropSound();
      enteredPin = enteredPin.slice(0, -1);
      updatePinDots();
    }

    function clearPin(e) {
      if(e) createRipple(e);
      playWaterDropSound();
      enteredPin = "";
      updatePinDots();
    }

    function updatePinDots() {
      for(let i = 1; i <= 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if(i <= enteredPin.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      }
    }
        function verifyPin() {
      if(enteredPin === userPIN) {
        document.getElementById('pinOverlay').style.display = 'none';
      } else {
        alert("गलत PIN! सही PIN डालें (Default PIN: 1234)");
        enteredPin = "";
        updatePinDots();
      }
    }

    // Eye Toggle
    function toggleEye() {
      isHidden = !isHidden;
      document.getElementById('eyeIcon').className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      updateUI();
    }

    // Set Type
    function setType(type) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      if(type === 'expense') document.getElementById('typeExpense').classList.add('active');
      if(type === 'income') document.getElementById('typeIncome').classList.add('active');
      if(type === 'lend') document.getElementById('typeLend').classList.add('active');
      if(type === 'borrow') document.getElementById('typeBorrow').classList.add('active');
    }

    // Quick Preset Chips
    function quickFill(amt, desc, cat) {
      document.getElementById('txAmount').value = amt;
      document.getElementById('txDesc').value = desc;
      document.getElementById('txCategory').value = cat;
      setType('expense');
    }

    // Speech-to-Text Recognition
    function startVoiceRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("आपका ब्राउज़र वॉइस इनपुट सपोर्ट नहीं करता।");
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN';
      const micBtn = document.getElementById('micBtn');

      recognition.onstart = function() { micBtn.classList.add('recording'); };
      recognition.onend = function() { micBtn.classList.remove('recording'); };

      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        document.getElementById('txDesc').value = text;
        const numbers = text.match(/\d+/g);
        if (numbers && numbers.length > 0) {
          document.getElementById('txAmount').value = numbers[0];
        }
      };
      recognition.start();
    }

    // Add Transaction
    function addTransaction() {
      const desc = document.getElementById('txDesc').value.trim();
      const amount = parseFloat(document.getElementById('txAmount').value);
      const category = document.getElementById('txCategory').value;

      if(!desc || isNaN(amount) || amount <= 0) {
        alert("कृपया सही विवरण और रकम दर्ज करें!");
        return;
      }

      const newTx = {
        id: Date.now(),
        desc: desc,
        amount: amount,
        category: category,
        type: currentType,
        settled: false,
        date: new Date().toISOString()
      };

      transactions.unshift(newTx);
      saveData();
      
      playCoinSound();
      if(window.confetti) {
        confetti({ particleCount: 70, spread: 80, origin: { y: 0.8 }, colors: ['#ffd700', '#ffffff', '#2ed573'] });
      }

      document.getElementById('txDesc').value = '';
      document.getElementById('txAmount').value = '';
      updateUI();
    }

    function toggleSettle(id) {
      transactions = transactions.map(t => {
        if(t.id === id) t.settled = !t.settled;
        return t;
      });
      saveData();
      updateUI();
    }

    function deleteTx(id) {
      if(confirm("क्या आप इस एंट्री को हटाना चाहते हैं?")) {
        transactions = transactions.filter(t => t.id !== id);
        saveData();
        updateUI();
      }
    }

    function saveData() {
      localStorage.setItem('laxmi_txs', JSON.stringify(transactions));
    }

    function renderTransactions() {
      const listEl = document.getElementById('txList');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const monthFilter = document.getElementById('filterMonth').value;

      listEl.innerHTML = '';

      const filtered = transactions.filter(t => {
        const matchesSearch = t.desc.toLowerCase().includes(search) || t.category.toLowerCase().includes(search);
        const tMonth = new Date(t.date).getMonth() + "-" + new Date(t.date).getFullYear();
        const matchesMonth = (monthFilter === 'ALL' || tMonth === monthFilter);
        return matchesSearch && matchesMonth;
      });

      if(filtered.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:18px; font-size:13px;">कोई रिकॉर्ड नहीं मिला।</div>';
        return;
      }

      filtered.forEach(t => {
        const item = document.createElement('div');
        let prefix = t.type === 'income' ? '+' : '-';
        let badge = t.type === 'lend' ? ' (उधार दिया)' : (t.type === 'borrow' ? ' (उधार लिया)' : '');
        
        item.className = `tx-item ${t.type} ${t.settled ? 'tx-settled' : ''}`;
        item.innerHTML = `
          <div>
            <strong style="color:#fff; font-size:14px;">${t.desc}</strong> <small style="color:var(--accent-gold); font-size:10px;">${badge}</small><br>
            <span style="font-size:11px; color:var(--text-sub);">${t.category} • ${new Date(t.date).toLocaleDateString('hi-IN')}</span>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:bold; font-size:15px; color:${t.type === 'income' ? 'var(--green-glow)' : 'var(--red-glow)'}">
              ${prefix}₹${t.amount.toFixed(2)}
            </div>
            ${(t.type === 'lend' || t.type === 'borrow') ? 
              `<button onclick="toggleSettle(${t.id})" style="font-size:10px; padding:3px 8px; cursor:pointer; background:#1e293b; color:#fff; border:1px solid #475569; border-radius:6px; margin-top:4px;">${t.settled ? 'चुका दिया ✓' : 'चुकाएं'}</button>` : ''}
            <i class="fa-solid fa-trash" onclick="deleteTx(${t.id})" style="color:#64748b; font-size:13px; margin-left:10px; cursor:pointer;"></i>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function calcImpulse() {
      const price = parseFloat(document.getElementById('impulsePrice').value);
      const res = document.getElementById('impulseResult');
      if(isNaN(price) || price <= 0) {
        res.innerHTML = "कृपया सही रकम दर्ज करें।";
        return;
      }
      const pct = ((price / monthlyBudget) * 100).toFixed(1);
      let advice = pct > 10 ? "⚠️ यह आपके बजट का बड़ा हिस्सा है, सोच-समझकर खरीदें!" : "✅ यह आपकी सामान्य बजट सीमा में है।";
      res.innerHTML = `यह आपके ₹${monthlyBudget} बजट का <strong>${pct}%</strong> हिस्सा है। <br>${advice}`;
    }

    function renderChart() {
      const categories = {};
      transactions.filter(t => t.type === 'expense').forEach(t => {
        categories[t.category] = (categories[t.category] || 0) + t.amount;
      });

      const labels = Object.keys(categories);
      const data = Object.values(categories);

      const ctx = document.getElementById('categoryChart').getContext('2d');
      if(myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: ['#ef4444', '#3b82f6', '#f59e0b', '#10b981', '#8b5cf6', '#06b6d4', '#eab308']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#ffffff', font: { size: 11 } } } }
        }
      });
    }

    function renderHeatmap() {
      const grid = document.getElementById('heatmapGrid');
      grid.innerHTML = '';
      const now = new Date();
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

      const dailyMap = {};
      transactions.filter(t => t.type === 'expense').forEach(t => {
        const d = new Date(t.date);
        if(d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
          const dayNum = d.getDate();
          dailyMap[dayNum] = (dailyMap[dayNum] || 0) + t.amount;
        }
      });

      for(let i=1; i<=daysInMonth; i++) {
        const dayEl = document.createElement('div');
        const spent = dailyMap[i] || 0;
        let heatClass = 'heatmap-day';
        if(spent > 0 && spent <= 200) heatClass += ' heat-low';
        else if(spent > 200 && spent <= 700) heatClass += ' heat-mid';
        else if(spent > 700) heatClass += ' heat-high';

        dayEl.className = heatClass;
        dayEl.innerHTML = `<strong>${i}</strong><br>₹${spent}`;
        grid.appendChild(dayEl);
      }
    }

    function updateUI() {
      let totalIncome = 0, totalExpense = 0;
      transactions.forEach(t => {
        if(t.type === 'income') totalIncome += t.amount;
        if(t.type === 'expense') totalExpense += t.amount;
      });

      const netBalance = totalIncome - totalExpense;
      document.getElementById('balanceDisplay').innerText = isHidden ? '••••••' : `₹${netBalance.toFixed(2)}`;

      const now = new Date();
      const totalDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const daysLeft = totalDays - now.getDate() + 1;
      const safeDailyLimit = netBalance > 0 ? (netBalance / daysLeft) : 0;

      document.getElementById('dailyLimitDisplay').innerText = isHidden ? '••' : `₹${safeDailyLimit.toFixed(0)}`;
      document.getElementById('daysLeftDisplay').innerText = `${daysLeft} दिन`;

      const alertBanner = document.getElementById('alertBanner');
      const avgDailySpend = totalExpense / (now.getDate() || 1);
      const predictedExpense = avgDailySpend * totalDays;

      if(predictedExpense > totalIncome && totalIncome > 0) {
        alertBanner.style.display = 'block';
        document.getElementById('alertText').innerText = `चेतावनी! इस गति से आपका पूरा बजट महीने के अंत से पहले खत्म हो सकता है।`;
      } else {
        alertBanner.style.display = 'none';
      }

      const monthSelect = document.getElementById('filterMonth');
      const months = [...new Set(transactions.map(t => {
        const d = new Date(t.date);
        return d.getMonth() + "-" + d.getFullYear();
      }))];
      
      monthSelect.innerHTML = '<option value="ALL">सभी महीने</option>';
      months.forEach(m => {
        const option = document.createElement('option');
        option.value = m; option.innerText = m;
        monthSelect.appendChild(option);
      });

      renderTransactions();
      renderChart();
      renderHeatmap();
    }

    // PDF Export Tool
    function exportPDF() {
      const element = document.getElementById('printableArea');
      const opt = {
        margin:       0.3,
        filename:     `Laxmi_Hisab_Report_${Date.now()}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, background: '#080a0f' },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    // Excel Export Tool (SheetJS)
    function exportExcel() {
      const excelData = transactions.map(t => ({
        "दिनांक": new Date(t.date).toLocaleDateString('hi-IN'),
        "विवरण": t.desc,
        "रकम (₹)": t.amount,
        "प्रकार": t.type,
        "श्रेणी": t.category,
        "स्थिति": t.settled ? "चुकता" : "बाकी"
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "लक्ष्मी हिसाब");
      XLSX.writeFile(workbook, `Laxmi_Hisab_${Date.now()}.xlsx`);
    }

    // WhatsApp Share Tool
    function shareWhatsApp() {
      let text = "✨ *लक्ष्मी हिसाब-किताब रिपोर्ट* ✨\n\n";
      let totalExp = transactions.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
      let totalInc = transactions.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0);
      
      text += `💰 कुल आय: ₹${totalInc}\n💸 कुल खर्च: ₹${totalExp}\n⚖️ शुद्ध बचत: ₹${totalInc - totalExp}\n\n*हालिया लेन-देन:* \n`;
      transactions.slice(0, 5).forEach(t => {
        text += `• ${t.desc}: ₹${t.amount} (${t.category})\n`;
      });

      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    // JSON Backup / Restore
    function exportJSON() {
      const blob = new Blob([JSON.stringify(transactions, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Laxmi_Backup_${Date.now()}.json`;
      a.click();
    }

    function importJSON(event) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          transactions = JSON.parse(e.target.result);
          saveData();
          updateUI();
          alert("डेटा सफलतापूर्वक रीस्टोर हो गया!");
        } catch(err) { alert("गलत बैकअप फ़ाइल!"); }
      };
      reader.readAsText(event.target.files[0]);
    }

    window.onload = function() {
      updateUI();
    };
  </script>
</body>
