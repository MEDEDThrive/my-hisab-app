<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aesthetic Expense Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-12 flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-md my-6 text-center">
        <h1 class="text-3xl font-extrabold bg-gradient-to-r from-emerald-400 via-indigo-400 to-cyan-400 bg-clip-text text-transparent">
            Hisab-Kitab ⚡
        </h1>
        <p class="text-xs text-slate-400 mt-1">Aesthetic & Smart Expense Tracker</p>
    </header>

    <!-- Expense Entry Form -->
    <main class="w-full max-w-md space-y-6">
        <form id="expenseForm" class="glass-card rounded-3xl p-5 shadow-2xl space-y-4">
            
            <!-- Amount -->
            <div>
                <label class="text-xs text-slate-400 font-medium block mb-1">रकम (Amount ₹)</label>
                <div class="relative">
                    <span class="absolute left-4 top-3 text-emerald-400 font-bold text-lg">₹</span>
                    <input type="number" id="amount" required placeholder="0.00" 
                        class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl py-2.5 pl-9 pr-4 text-white text-lg font-bold focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- Item / Reason -->
            <div>
                <label class="text-xs text-slate-400 font-medium block mb-1">किस चीज़ पर खर्च हुआ? (Item)</label>
                <input type="text" id="item" required placeholder="जैसे: चाय, पेट्रोल, राशन" 
                    class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
            </div>

            <!-- Person / Shop -->
            <div>
                <label class="text-xs text-slate-400 font-medium block mb-1">किसको दिया? (Paid To / Person)</label>
                <input type="text" id="paidTo" placeholder="जैसे: शर्मा स्वीट्स, राहुल दोस्त" 
                    class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
            </div>

            <!-- Location with GPS Button -->
            <div>
                <label class="text-xs text-slate-400 font-medium block mb-1">कहाँ खर्च किया? (Location)</label>
                <div class="flex gap-2">
                    <input type="text" id="location" placeholder="जैसे: टावर चौक, फ्रीगंज" 
                        class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl py-2.5 px-4 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                    <button type="button" onclick="getGPSLocation()" title="GPS से लोकेशन लें"
                        class="bg-indigo-600/80 hover:bg-indigo-600 px-3 py-2.5 rounded-xl text-white transition flex items-center justify-center">
                        <i data-lucide="map-pin" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Payment Mode -->
            <div>
                <label class="text-xs text-slate-400 font-medium block mb-1">पेमेंट का तरीका (Mode)</label>
                <select id="paymentMode" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl py-2.5 px-4 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition">
                    <option value="UPI">UPI (PhonePe / GPay / Paytm)</option>
                    <option value="Cash">Cash (नकद)</option>
                    <option value="Card">Card</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-indigo-600 hover:opacity-90 font-bold py-3 rounded-xl transition transform active:scale-95 shadow-lg shadow-indigo-500/20 text-white mt-2 flex items-center justify-center gap-2">
                <i data-lucide="plus-circle" class="w-5 h-5"></i> खर्च जोड़ें (Add Expense)
            </button>
        </form>

        <!-- Transaction History -->
        <section class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-semibold text-slate-300">हाल के खर्चे (Recent Transactions)</h2>
                <span id="totalAmount" class="text-xs font-bold text-emerald-400 bg-emerald-950/60 px-2.5 py-1 rounded-lg border border-emerald-800/50">कुल: ₹0</span>
            </div>
            
            <div id="expenseList" class="space-y-2.5">
                <!-- Data dynamically inserted here -->
            </div>
        </section>
    </main>

    <script>
        lucide.createIcons();
        let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];

        function renderExpenses() {
            const list = document.getElementById('expenseList');
            const totalEl = document.getElementById('totalAmount');
            list.innerHTML = '';
            
            let total = 0;

            if (expenses.length === 0) {
                list.innerHTML = `<div class="glass-card rounded-2xl p-6 text-center text-slate-500 text-xs">अभी तक कोई खर्चा दर्ज नहीं हुआ है।</div>`;
                totalEl.innerText = `कुल: ₹0`;
                return;
            }

            expenses.slice().reverse().forEach((exp, index) => {
                total += parseFloat(exp.amount);
                const actualIndex = expenses.length - 1 - index;
                
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-4 flex justify-between items-center shadow-md border border-slate-800/80 hover:border-slate-700 transition";
                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-100">${exp.item}</span>
                            <span class="text-[10px] bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded-md border border-indigo-800/40">${exp.mode}</span>
                        </div>
                        <div class="text-xs text-slate-400 flex flex-wrap gap-x-3 gap-y-0.5">
                            ${exp.paidTo ? `<span>👤 ${exp.paidTo}</span>` : ''}
                            ${exp.location ? `<span>📍 ${exp.location}</span>` : ''}
                        </div>
                        <div class="text-[10px] text-slate-500">${exp.date}</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-extrabold text-emerald-400 text-base">₹${parseFloat(exp.amount).toFixed(2)}</span>
                        <button onclick="deleteExpense(${actualIndex})" class="text-slate-500 hover:text-red-400 transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });

            totalEl.innerText = `कुल: ₹${total.toFixed(2)}`;
            lucide.createIcons();
        }

        document.getElementById('expenseForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newExp = {
                amount: document.getElementById('amount').value,
                item: document.getElementById('item').value,
                paidTo: document.getElementById('paidTo').value,
                location: document.getElementById('location').value,
                mode: document.getElementById('paymentMode').value,
                date: new Date().toLocaleString('hi-IN', { dateStyle: 'medium', timeStyle: 'short' })
            };

            expenses.push(newExp);
            localStorage.setItem('my_expenses', JSON.stringify(expenses));
            document.getElementById('expenseForm').reset();
            renderExpenses();
        });

        function deleteExpense(index) {
            expenses.splice(index, 1);
            localStorage.setItem('my_expenses', JSON.stringify(expenses));
            renderExpenses();
        }

        function getGPSLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude.toFixed(4);
                    const lng = pos.coords.longitude.toFixed(4);
                    document.getElementById('location').value = `GPS (${lat}, ${lng})`;
                }, () => {
                    alert('लोकेशन एक्सेस नहीं मिल पाई। कृपया मैन्युअली नाम टाइप करें।');
                });
            } else {
                alert('आपके ब्राउज़र में GPS सपोर्ट नहीं है।');
            }
        }

        renderExpenses();
    </script>
</body>
</html>
